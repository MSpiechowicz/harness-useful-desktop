# Workspace root: the business crate and the thin Tauri shell.
[workspace]
resolver = "3"
members = ["business", "src-tauri"]

[workspace.package]
version = "0.12.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/MSpiechowicz/harness-useful-desktop"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Pinned once here; member crates use `name.workspace = true`.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: config viewer shows keys in source order (Value maps keep insertion order).
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
which = "8.0.6"
dirs = "7.0.0"
ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }
serde_norway = "0.9.42"
regex = "1.13"
tracing = "0.1.44"
uuid = { version = "1.27", features = ["v4"] }
similar = "3.2.0"
# Updater public-key validation (the same decoders tauri-plugin-updater verifies signatures with).
base64 = "0.22"
minisign-verify = "0.2"
# Desktop shell (Tauri 2 only; Tauri 3 alpha is not used).
tauri = "2.12.2"
tauri-build = "2.7.1"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-log = "2.10.0"
# Signed in-app updates over TLS. `zip` (Tauri v1 update bundles) is not needed: the bundler
# writes v2 updater artifacts (`bundle.createUpdaterArtifacts: true`).
tauri-plugin-updater = { version = "2.13.2", default-features = false, features = ["rustls-tls", "system-proxy"] }
# The companion release lookup (`ecosystem_releases`) reuses the updater's HTTP and TLS stack:
# the same reqwest and rustls versions and features, so no crate is added to the lockfile.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Formats the release date the updater parses (RFC 3339).
time = { version = "0.3.55", features = ["formatting"] }
# Plays the launch sound natively: Tauri gives the Linux webview no way to allow audio before a user gesture.
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
dunce = "1.0.5"
# Unix-only: process-group kill (`killpg`) and non-blocking open flags.
nix = { version = "0.31.3", default-features = false, features = ["signal", "fs", "process"] }
# Dev dependencies
tempfile = "3.27.0"
insta = { version = "1.49.0", features = ["json"] }
pretty_assertions = "1.4"

# Default codegen units and no cross-crate LTO: the release bundles compile in about half the time, and an app
# that mostly waits on the webview and the agents gains nothing measurable from the slower settings.
[profile.release]
opt-level = 3
strip = true
