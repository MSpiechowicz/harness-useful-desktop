# Codex settings for the fixture home. Every CANARY value must stay hidden.
model = "gpt-5-codex"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
notify = ["notify-send", "Codex"]

[shell_environment_policy]
inherit = "core"
set = { DEPLOY_HOOK = "CANARY-7f3a9c" }

[model_providers.azure]
name = "Azure"
base_url = "https://example.openai.azure.com/openai"
env_key = "AZURE_OPENAI_API_KEY"
query_params = { "api-version" = "2025-04-01", "api-key" = "CANARY-7f3a9c" }

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github", "--token", "CANARY-7f3a9c"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "CANARY-7f3a9c" }

[mcp_servers.docs]
url = "https://docs.example.com/mcp"
bearer_token_env_var = "DOCS_TOKEN"
http_headers = { Authorization = "Bearer CANARY-7f3a9c" }

[mcp_servers.paused]
command = "paused-server"
enabled = false

[marketplaces.demo-market]
source_type = "git"
source = "acme/demo-market"
last_updated = "2026-10-20T10:00:00Z"

[marketplaces.openai-bundled]
source_type = "local"
source = "~/.codex/.tmp/bundled-marketplaces/openai-bundled"

[plugins."lint-tools@demo-market"]
enabled = true

[plugins."pdf@openai-bundled"]
enabled = false

[plugins."ghost@demo-market"]
enabled = true

[features]
hooks = true

[tui.notifications]
enabled = true
