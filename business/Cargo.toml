[package]
name = "harness_business"
description = "Business layer of Harness Desktop (no Tauri dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Exposes `harness_business::testing` (in-memory process doubles) to other crates' tests.
test-support = []

[dependencies]
base64.workspace = true
csv.workspace = true
dunce.workspace = true
flate2.workspace = true
jiff.workspace = true
minisign-verify.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs.workspace = true
which.workspace = true
dirs.workspace = true
serde_norway.workspace = true
sha2.workspace = true
toml.workspace = true
uuid.workspace = true

# Scripted OMP/PI peer for the agent-session integration tests (`CARGO_BIN_EXE_fake_agent`).
[[bin]]
name = "fake_agent"
path = "src/bin/fake_agent.rs"
test = false
doc = false

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
# Self dev-dependency: enables `test-support` for this crate's integration tests.
harness_business = { path = ".", features = ["test-support"] }
insta.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
