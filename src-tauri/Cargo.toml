[package]
name = "harness_desktop"
description = "Harness Desktop: a thin Tauri shell over the harness_business crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "harness_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "harness-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
harness_business = { path = "../business" }
serde.workspace = true
# `generate_context!` embeds the `plugins` section of `tauri.conf.json` as `serde_json` values.
serde_json.workspace = true
# `tray-icon` + `image-png`: the system tray icon (see `tray`).
tauri = { workspace = true, features = ["tray-icon", "image-png"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-log.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true
rodio.workspace = true
# The companion release lookup (`releases`): the updater's own reqwest/rustls, nothing new.
reqwest.workspace = true
rustls.workspace = true
time.workspace = true
# `log` feature: tracing events from the business crate reach tauri-plugin-log (no subscriber is installed).
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
# Test temp dirs canonicalize like the business crate: plain `C:\...` on Windows, not the `\\?\` verbatim form.
dunce.workspace = true

[lints]
workspace = true
