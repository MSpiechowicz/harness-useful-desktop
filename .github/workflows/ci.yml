name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

jobs:
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version; install it when the runner lacks it.
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      # Dependency caches are written by main only and read by pull requests (save-if). Every job family has its
      # own shared-key: a key is saved by the first job that finishes, so jobs that build different artifacts
      # (clippy metadata here, test binaries in business-tests.yml, the Tauri stack below) must not share one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p harness_business --all-targets -- -D warnings

  # Build the tests once per OS, then run them in shards from the archive (see business-tests.yml). The Linux
  # call also verifies the generated bindings from the same archive.
  business-tests:
    name: Business tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shards: "[1,2,3]"
            bindings: true
          - os: macos-latest
            shards: "[1,2]"
            bindings: false
          - os: windows-latest
            shards: "[1,2,3]"
            bindings: false
    uses: ./.github/workflows/business-tests.yml
    with:
      os: ${{ matrix.os }}
      shards: ${{ matrix.shards }}
      bindings: ${{ matrix.bindings }}

  # Supply-chain policy for Rust dependencies (see deny.toml).
  rust-deps:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny
      - run: cargo deny check advisories bans licenses sources

  ui-check:
    name: UI type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check

  ui-test:
    name: UI tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx vitest run --config ui/vitest.config.ts --passWithNoTests --shard=${{ matrix.shard }}/3

  guards:
    name: Guards and duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # Two advisories are ignored (see package.json "audit"): GHSA-vfj7-8cjw-p6xm, braces <=3.0.3 DoS
      # (semantic-release -> micromatch -> braces), and GHSA-gcqx-w48m-w2h4, deepmerge <=4.3.1 prototype
      # poisoning (vite-plugin-svelte -> deepmerge). Both are dev-only build tooling, not shipped, and
      # have no fixed release yet. Remove each ignore once a fixed release ships.
      - run: bun run audit
      - run: bun run guard
      - run: bun run dup

  ui-build:
    name: UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - name: Production bundle must not contain the mock transport
        run: |
          if grep -rn "__HARNESS_MOCK_TRANSPORT__" ui/dist; then
            echo "Mock transport leaked into the production bundle"
            exit 1
          fi

  # macOS and Windows build the whole app again on every push to main (the release bundles), so pull requests
  # only run the Linux check and the other two run on main.
  tauri-check:
    name: Tauri check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["ubuntu-22.04","macos-latest","windows-latest"]' || '["ubuntu-22.04"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux system libraries
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tauri-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run build:ui
      - run: cargo clippy -p harness_desktop -- -D warnings
      # The agent command tests spawn this binary; `cargo test -p harness_desktop` alone does not
      # build it, and HARNESS_REQUIRE_FAKE_AGENT makes them fail instead of skipping without it.
      - run: cargo build -p harness_business --bin fake_agent
      - run: cargo test -p harness_desktop
        env:
          HARNESS_REQUIRE_FAKE_AGENT: "1"
      # On main the release bundles build the app on every OS right after, so pull requests alone pay for this.
      - if: ${{ github.event_name == 'pull_request' }}
        run: bunx tauri build --debug --no-bundle
