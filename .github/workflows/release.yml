name: Release

# After CI succeeds on main, semantic-release analyses the Conventional Commits since the last tag.
# fix: -> patch, feat: -> minor, "BREAKING CHANGE:" footer or "feat!:" -> major; other types do not release.
# On a release it bumps package.json/Cargo.toml/Cargo.lock, updates CHANGELOG.md, pushes the release commit and
# the vX.Y.Z tag and creates a DRAFT GitHub release. The bundle job then builds installers on every OS and
# uploads them to that draft; the publish job writes latest.json for the updater and finally un-drafts it.
# See docs/release-and-updater-keys.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Releases run one at a time and are never cancelled half-way (a cancelled run could leave a tag without bundles).
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  BUN_VERSION: 1.4.2

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Version and draft release
    # Only releases from main: CI must have passed for a push to main, or a manual run on main.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag, create the draft release
    outputs:
      # Written by the exec plugin's successCmd (see .releaserc.json). Empty when nothing was released.
      released: ${{ steps.semantic-release.outputs.released }}
      version: ${{ steps.semantic-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit CI validated. If main has moved on since, semantic-release sees a stale
          # branch and does nothing; the newer push gets its own run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # semantic-release needs the full history and tags
          persist-credentials: false # semantic-release authenticates with GITHUB_TOKEN itself
      # Runs before any tag exists: a release without the updater public key and its signing secret would
      # install fine but could never update. Only whether the secret is set reaches this step, never its value.
      - name: Check the updater key is configured
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          pubkey=$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)
          if [[ -z "$pubkey" || "$pubkey" == NOT_CONFIGURED* ]]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder. See docs/release-and-updater-keys.md."
            exit 1
          fi
          if [[ "$HAS_SIGNING_KEY" != 'true' ]]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set. See docs/release-and-updater-keys.md."
            exit 1
          fi
      # semantic-release is a Node program (it needs Node >= 22.14); bunx runs it through `node`.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      # semantic-release numbers a first release 1.0.0. A local v0.0.0 on the root commit (never pushed) makes the
      # first `feat:` release 0.1.0; once a v* tag exists this step does nothing.
      - name: Baseline tag for the first release
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
      - name: semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload assets to the draft release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 (AppImage, deb, rpm)
            os: ubuntu-22.04
            # The tray library is loaded at runtime, so linuxdeploy can't see it: the extra config ships it (and,
            # through it, dbusmenu) in the AppImage, built against the GLib the AppImage bundles. Without it the
            # host's copy is loaded, which needs a newer GLib and crashes the app on current distributions.
            args: --bundles appimage,deb,rpm --config src-tauri/tauri.appimage.conf.json
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
          - name: Windows x64 (NSIS, MSI)
            os: windows-latest
            args: --bundles nsis,msi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }} # the tag carries the bumped manifests
          persist-credentials: false
      - name: Install Linux system libraries
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            build-essential curl wget file libxdo-dev libssl-dev libasound2-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add Rust target
        if: ${{ matrix.target != '' }}
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          # The cache key ignores [profile.release], and an exact hit is never re-saved: bump this whenever the
          # profile changes, or every release rebuilds all dependencies from a cache built with the old settings.
          prefix-key: v1-release-profile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Build bundles and upload to the draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (not the OS installers). See docs/release-and-updater-keys.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: v${{ needs.release.outputs.version }}
          releaseDraft: true
          # latest.json is written once by the publish job: four jobs merging into it in parallel (read, delete,
          # re-upload) raced and failed a bundle job with "Not Found" on the asset delete.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [release, bundle]
    runs-on: ubuntu-latest
    permissions:
      contents: write # un-draft the release
    steps:
      # Every bundle job only uploads its installers and their .sig files. latest.json is written here, once all of
      # them are on the draft, so no platform can go missing from the updater manifest.
      - name: Write latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/updater"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$assets" \
            --pattern '*.AppImage' --pattern '*.AppImage.sig' --pattern '*.deb' --pattern '*.deb.sig' \
            --pattern '*.rpm' --pattern '*.rpm.sig' --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig' \
            --pattern '*.msi' --pattern '*.msi.sig' --pattern '*-setup.exe' --pattern '*-setup.exe.sig'
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          platforms='{}'
          missing=0
          # platform key, then the glob of its updater artifact on the release
          while read -r platform glob; do
            mapfile -t matches < <(compgen -G "$assets/$glob" || true)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -s "${matches[0]}.sig" ]; then
              echo "::error::no single signed artifact for $platform ($glob)"
              missing=1
              continue
            fi
            name="$(basename "${matches[0]}")"
            platforms="$(jq --arg platform "$platform" --arg url "$base/$name" --rawfile signature "${matches[0]}.sig" \
              '.[$platform] = {signature: $signature, url: $url}' <<< "$platforms")"
          done <<'PLATFORMS'
          linux-x86_64 *_amd64.AppImage
          linux-x86_64-appimage *_amd64.AppImage
          linux-x86_64-deb *_amd64.deb
          linux-x86_64-rpm *.x86_64.rpm
          darwin-aarch64 *_aarch64.app.tar.gz
          darwin-aarch64-app *_aarch64.app.tar.gz
          darwin-x86_64 *_x64.app.tar.gz
          darwin-x86_64-app *_x64.app.tar.gz
          windows-x86_64 *_x64_en-US.msi
          windows-x86_64-msi *_x64_en-US.msi
          windows-x86_64-nsis *_x64-setup.exe
          PLATFORMS
          if [ "$missing" -ne 0 ]; then exit 1; fi
          jq -n --arg version "$VERSION" --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" --argjson platforms "$platforms" \
            '{version: $version, notes: "", pub_date: $pub_date, platforms: $platforms}' > "$RUNNER_TEMP/latest.json"
          gh release upload "v$VERSION" "$RUNNER_TEMP/latest.json" --repo "$GITHUB_REPOSITORY" --clobber
      # install.sh / install.ps1 install nothing without a SHA-256 to compare against.
      - name: Upload checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          assets="$RUNNER_TEMP/assets"
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          rm -f "$assets/checksums.txt"
          (cd "$assets" && sha256sum -- * > "$RUNNER_TEMP/checksums.txt")
          gh release upload "v$VERSION" "$RUNNER_TEMP/checksums.txt" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish the draft release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
